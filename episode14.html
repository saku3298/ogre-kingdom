<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const ref = document.referrer || '';
  const fromComics =
    params.get('from') === 'comics' ||
    /volume\d+\.html/.test(ref);

  const back = document.getElementById('context-back');
  if (back) {
    if (fromComics) {
      back.href = 'volume3.html';
      back.textContent = '← 第3巻へ戻る';
    } else {
      back.href = 'index.html';
      back.textContent = '← 話一覧へ戻る';
    }
  }

  if (fromComics) {
    document.querySelectorAll('a[href^="episode"]').forEach(function(a) {
      const href = a.getAttribute('href').split('?')[0];
      a.setAttribute('href', href + '?from=comics');
    });
  }
})();
</script>


<script id="horizontal-reader-script">
(function(){
  const viewer=document.querySelector('.viewer');
  if(!viewer) return;

  // 既存の1ページ表示/縦表示切替UIは横スワイプ化後は不要
  const mode=document.getElementById('mode');
  if(mode) mode.style.display='none';

  const pages=[...viewer.querySelectorAll('.manga-page')];
  const counter=document.getElementById('counter');

  function currentIndex(){
    if(!viewer.clientWidth) return 0;
    return Math.round(viewer.scrollLeft/viewer.clientWidth);
  }
  function updateCounter(){
    if(counter){
      counter.textContent=(currentIndex()+1)+' / '+pages.length;
    }
  }
  function go(delta){
    const idx=Math.max(0,Math.min(pages.length-1,currentIndex()+delta));
    viewer.scrollTo({left:idx*viewer.clientWidth,behavior:'smooth'});
  }

  const prev=document.getElementById('prev');
  const next=document.getElementById('next');
  if(prev) prev.onclick=()=>go(-1);
  if(next) next.onclick=()=>go(1);

  let ticking=false;
  viewer.addEventListener('scroll',()=>{
    if(!ticking){
      requestAnimationFrame(()=>{updateCounter();ticking=false;});
      ticking=true;
    }
  });

  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft') go(-1);
    if(e.key==='ArrowRight') go(1);
  });

  updateCounter();
})();
</script>
