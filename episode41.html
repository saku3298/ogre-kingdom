<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const ref = document.referrer || '';
  const fromComics =
    params.get('from') === 'comics' ||
    /volume\d+\.html/.test(ref);

  const back = document.getElementById('context-back');
  if (back) {
    if (fromComics) {
      back.href = 'volume8.html';
      back.textContent = '← 第8巻へ戻る';
    } else {
      back.href = 'index.html';
      back.textContent = '← 話一覧へ戻る';
    }
  }

  if (fromComics) {
    document.querySelectorAll('a[href^="episode"]').forEach(function(a) {
      const href = a.getAttribute('href').split('?')[0];
      a.setAttribute('href', href + '?from=comics');
    });
  }
})();
</script>








<script id="manga-swipe-direction-script">
(function(){
  const viewer=document.querySelector('.viewer');
  if(!viewer) return;

  const pages=[...viewer.querySelectorAll('.manga-page')];
  const counter=document.getElementById('counter');
  const prev=document.getElementById('prev');
  const next=document.getElementById('next');
  const topBtn=document.getElementById('top');

  function maxScroll(){
    return Math.max(0, viewer.scrollWidth - viewer.clientWidth);
  }

  // row-reverseなので、第1ページは一番右端
  function currentIndex(){
    const pageWidth=viewer.clientWidth || 1;
    return Math.round((maxScroll() - viewer.scrollLeft) / pageWidth);
  }

  function updateCounter(){
    const idx=Math.max(0,Math.min(pages.length-1,currentIndex()));
    if(counter) counter.textContent=(idx+1)+' / '+pages.length;
  }

  function goTo(idx, smooth=true){
    idx=Math.max(0,Math.min(pages.length-1,idx));
    const left=maxScroll() - idx*viewer.clientWidth;
    viewer.scrollTo({left:left,behavior:smooth?'smooth':'auto'});
  }

  function go(delta){ goTo(currentIndex()+delta,true); }

  if(prev) prev.onclick=()=>go(-1);
  if(next) next.onclick=()=>go(1);
  if(topBtn) topBtn.onclick=()=>goTo(0,true);

  // PCキー操作も漫画のページ送り方向に合わせる
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight') go(1);
    if(e.key==='ArrowLeft') go(-1);
  });

  viewer.addEventListener('scroll',()=>{
    requestAnimationFrame(updateCounter);
  },{passive:true});

  // 初期表示は第1ページ（右端）
  requestAnimationFrame(()=>{
    goTo(0,false);
    updateCounter();
  });

  window.addEventListener('resize',()=>{
    const idx=currentIndex();
    requestAnimationFrame(()=>goTo(idx,false));
  });
})();
</script>
