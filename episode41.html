<script id="true-manga-swipe-script">
(function(){
  const viewer=document.querySelector('.viewer');
  if(!viewer) return;

  const pages=[...viewer.querySelectorAll('.manga-page')];
  if(!pages.length) return;

  const counter=document.getElementById('counter');
  const topBtn=document.getElementById('top');
  let index=0;
  let startX=0,startY=0,dx=0,dragging=false,locked=null;
  let animating=false;

  function setViewerHeight(){
    const img=pages[index].querySelector('img');
    if(!img) return;
    const apply=()=>{
      viewer.style.height=pages[index].offsetHeight+'px';
    };
    if(img.complete) requestAnimationFrame(apply);
    else img.addEventListener('load',()=>requestAnimationFrame(apply),{once:true});
  }

  function prepare(){
    pages.forEach((p,i)=>{
      p.classList.remove('is-active','is-next','is-prev');
      p.style.transition='none';
      p.style.transform='translateX(0)';
      if(i===index){
        p.classList.add('is-active');
        p.style.transform='translateX(0)';
      }else if(i===index+1){
        p.classList.add('is-next');
        p.style.transform='translateX(-100%)';
      }else if(i===index-1){
        p.classList.add('is-prev');
        p.style.transform='translateX(100%)';
      }
    });
    if(counter) counter.textContent=(index+1)+' / '+pages.length;
    setViewerHeight();
  }

  function animateTo(newIndex, direction){
    if(animating) return;
    animating=true;

    const cur=pages[index];
    const other=pages[newIndex];
    if(!cur || !other){ animating=false; return; }

    cur.style.transition='transform .22s ease';
    other.style.transition='transform .22s ease';

    if(direction==='next'){
      // 右へスワイプ:
      // 現在ページは右へ消える / 次ページは左から入る
      cur.style.transform='translateX(100%)';
      other.style.transform='translateX(0)';
    }else{
      // 左へスワイプ:
      // 現在ページは左へ消える / 前ページは右から入る
      cur.style.transform='translateX(-100%)';
      other.style.transform='translateX(0)';
    }

    setTimeout(()=>{
      index=newIndex;
      animating=false;
      prepare();
    },230);
  }

  function snapBack(){
    const cur=pages[index];
    const next=pages[index+1];
    const prev=pages[index-1];
    [cur,next,prev].forEach(p=>{if(p)p.style.transition='transform .18s ease';});
    if(cur) cur.style.transform='translateX(0)';
    if(next) next.style.transform='translateX(-100%)';
    if(prev) prev.style.transform='translateX(100%)';
    setTimeout(prepare,190);
  }

  viewer.addEventListener('touchstart',e=>{
    if(animating || e.touches.length!==1) return;
    const t=e.touches[0];
    startX=t.clientX; startY=t.clientY;
    dx=0; dragging=true; locked=null;

    [pages[index],pages[index+1],pages[index-1]].forEach(p=>{
      if(p)p.style.transition='none';
    });
  },{passive:true});

  viewer.addEventListener('touchmove',e=>{
    if(!dragging || e.touches.length!==1) return;
    const t=e.touches[0];
    const moveX=t.clientX-startX;
    const moveY=t.clientY-startY;

    if(locked===null){
      if(Math.abs(moveX)<8 && Math.abs(moveY)<8) return;
      locked=Math.abs(moveX)>Math.abs(moveY)?'x':'y';
    }
    if(locked!=='x') return;

    e.preventDefault();
    dx=moveX;

    const cur=pages[index];
    const next=pages[index+1];
    const prev=pages[index-1];
    const w=viewer.clientWidth || 1;

    if(dx>0){
      // 右へ指を動かす: 次ページを左から引き込む
      if(index>=pages.length-1){ dx*=0.25; }
      cur.style.transform=`translateX(${dx}px)`;
      if(next) next.style.transform=`translateX(${-w+dx}px)`;
    }else{
      // 左へ指を動かす: 前ページを右から引き込む
      if(index<=0){ dx*=0.25; }
      cur.style.transform=`translateX(${dx}px)`;
      if(prev) prev.style.transform=`translateX(${w+dx}px)`;
    }
  },{passive:false});

  viewer.addEventListener('touchend',()=>{
    if(!dragging) return;
    dragging=false;

    if(locked!=='x'){ prepare(); return; }

    const threshold=Math.min(90,(viewer.clientWidth||1)*0.18);

    if(dx>threshold && index<pages.length-1){
      animateTo(index+1,'next');
    }else if(dx<-threshold && index>0){
      animateTo(index-1,'prev');
    }else{
      snapBack();
    }
  },{passive:true});

  if(topBtn){
    topBtn.onclick=()=>{
      index=0;
      prepare();
      window.scrollTo({top:0,behavior:'smooth'});
    };
  }

  // PC確認用
  document.addEventListener('keydown',e=>{
    if(animating) return;
    if(e.key==='ArrowRight' && index<pages.length-1) animateTo(index+1,'next');
    if(e.key==='ArrowLeft' && index>0) animateTo(index-1,'prev');
  });

  window.addEventListener('resize',prepare);
  prepare();
})();
</script>
