<script>
const body=document.body,pages=[...document.querySelectorAll('.manga-page')],counter=document.getElementById('counter');
const modeBtn=document.getElementById('mode');let idx=0,single=false;
function show(){pages.forEach((p,i)=>p.classList.toggle('active',i===idx));counter.textContent=single?`${idx+1} / ${pages.length}`:'縦スクロール表示';if(single)scrollTo({top:0,behavior:'smooth'})}
function enableSingle(){if(!single){single=true;body.classList.add('single');modeBtn.textContent='縦スクロール'}}
modeBtn.onclick=()=>{single=!single;body.classList.toggle('single',single);modeBtn.textContent=single?'縦スクロール':'1ページ表示';show()};
prev.onclick=()=>{enableSingle();idx=Math.max(0,idx-1);show()};
next.onclick=()=>{enableSingle();idx=Math.min(pages.length-1,idx+1);show()};
top.onclick=()=>scrollTo({top:0,behavior:'smooth'});
document.addEventListener('keydown',e=>{if(!single)return;if(e.key==='ArrowLeft')prev.click();if(e.key==='ArrowRight')next.click();});
</script></body></html>
