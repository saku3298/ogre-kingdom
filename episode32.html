<script id="responsive-manga-reader-script">
(function(){
  const viewer=document.querySelector('.viewer');
  if(!viewer) return;

  const originalPages=[...viewer.querySelectorAll('.manga-page')];
  if(!originalPages.length) return;

  const counter=document.getElementById('counter');
  const topBtn=document.getElementById('top');
  let slides=[];
  let slideIndex=0;
  let currentPageIndex=0;
  let startX=0,startY=0,dx=0,dragging=false,locked=null,animating=false;
  let landscapeMode=false;

  function isLandscapeSpread(){
    return window.matchMedia('(orientation: landscape)').matches && window.innerWidth <= 1000;
  }

  function buildSlides(){
    // 現在表示しているページ番号を保持
    const currentPage=currentPageIndex;

    viewer.innerHTML='';
    slides=[];
    landscapeMode=isLandscapeSpread();

    if(landscapeMode){
      for(let i=0;i<originalPages.length;i+=2){
        const slide=document.createElement('div');
        slide.className='reader-slide spread';
        slide.dataset.start=String(i);
        slide.appendChild(originalPages[i]);
        if(originalPages[i+1]) slide.appendChild(originalPages[i+1]);
        viewer.appendChild(slide);
        slides.push(slide);
      }
      slideIndex=Math.floor(currentPage/2);
    }else{
      originalPages.forEach((page,i)=>{
        const slide=document.createElement('div');
        slide.className='reader-slide single';
        slide.dataset.start=String(i);
        slide.appendChild(page);
        viewer.appendChild(slide);
        slides.push(slide);
      });
      slideIndex=Math.min(currentPage,slides.length-1);
    }

    prepare();
  }

  function slideStart(i){
    return Number(slides[i]?.dataset.start || 0);
  }

  function setViewerHeight(){
    const s=slides[slideIndex];
    if(!s) return;

    const imgs=[...s.querySelectorAll('img')];
    const apply=()=>{
      const h=Math.max(...[...s.children].map(el=>el.offsetHeight),0);
      viewer.style.height=h+'px';
    };

    if(imgs.every(img=>img.complete)) requestAnimationFrame(apply);
    else imgs.forEach(img=>img.addEventListener('load',()=>requestAnimationFrame(apply),{once:true}));
  }

  function updateCounter(){
    if(!counter) return;
    const start=slideStart(slideIndex);
    currentPageIndex=start;

    if(landscapeMode && start+1<originalPages.length){
      counter.textContent=(start+1)+'-'+(start+2)+' / '+originalPages.length;
    }else{
      counter.textContent=(start+1)+' / '+originalPages.length;
    }
  }

  function prepare(){
    slides.forEach((s,i)=>{
      s.classList.remove('is-active','is-next','is-prev');
      s.style.transition='none';
      s.style.transform='translateX(0)';
      if(i===slideIndex){
        s.classList.add('is-active');
        s.style.transform='translateX(0)';
      }else if(i===slideIndex+1){
        s.classList.add('is-next');
        s.style.transform='translateX(-100%)';
      }else if(i===slideIndex-1){
        s.classList.add('is-prev');
        s.style.transform='translateX(100%)';
      }
    });
    updateCounter();
    setViewerHeight();
  }

  function animateTo(newIndex,direction){
    if(animating || newIndex<0 || newIndex>=slides.length) return;
    animating=true;

    const cur=slides[slideIndex];
    const other=slides[newIndex];
    cur.style.transition='transform .22s ease';
    other.style.transition='transform .22s ease';

    if(direction==='next'){
      // 右へスワイプ：今の見開きが右へ、次の見開きが左から入る
      cur.style.transform='translateX(100%)';
      other.style.transform='translateX(0)';
    }else{
      // 左へスワイプ：今の見開きが左へ、前の見開きが右から入る
      cur.style.transform='translateX(-100%)';
      other.style.transform='translateX(0)';
    }

    setTimeout(()=>{
      slideIndex=newIndex;
      currentPageIndex=slideStart(slideIndex);
      animating=false;
      prepare();
    },230);
  }

  function snapBack(){
    const cur=slides[slideIndex];
    const next=slides[slideIndex+1];
    const prev=slides[slideIndex-1];
    [cur,next,prev].forEach(s=>{if(s)s.style.transition='transform .18s ease';});
    if(cur) cur.style.transform='translateX(0)';
    if(next) next.style.transform='translateX(-100%)';
    if(prev) prev.style.transform='translateX(100%)';
    setTimeout(prepare,190);
  }

  viewer.addEventListener('touchstart',e=>{
    if(animating || e.touches.length!==1) return;
    const t=e.touches[0];
    startX=t.clientX;
    startY=t.clientY;
    dx=0;
    dragging=true;
    locked=null;
    [slides[slideIndex],slides[slideIndex+1],slides[slideIndex-1]].forEach(s=>{
      if(s)s.style.transition='none';
    });
  },{passive:true});

  viewer.addEventListener('touchmove',e=>{
    if(!dragging || e.touches.length!==1) return;
    const t=e.touches[0];
    const moveX=t.clientX-startX;
    const moveY=t.clientY-startY;

    if(locked===null){
      if(Math.abs(moveX)<8 && Math.abs(moveY)<8) return;
      locked=Math.abs(moveX)>Math.abs(moveY)?'x':'y';
    }
    if(locked!=='x') return;

    e.preventDefault();
    dx=moveX;
    const cur=slides[slideIndex];
    const next=slides[slideIndex+1];
    const prev=slides[slideIndex-1];
    const w=viewer.clientWidth||1;

    if(dx>0){
      if(slideIndex>=slides.length-1) dx*=0.25;
      cur.style.transform=`translateX(${dx}px)`;
      if(next) next.style.transform=`translateX(${-w+dx}px)`;
    }else{
      if(slideIndex<=0) dx*=0.25;
      cur.style.transform=`translateX(${dx}px)`;
      if(prev) prev.style.transform=`translateX(${w+dx}px)`;
    }
  },{passive:false});

  viewer.addEventListener('touchend',()=>{
    if(!dragging) return;
    dragging=false;
    if(locked!=='x'){prepare();return;}

    const threshold=Math.min(90,(viewer.clientWidth||1)*0.18);
    if(dx>threshold && slideIndex<slides.length-1){
      animateTo(slideIndex+1,'next');
    }else if(dx<-threshold && slideIndex>0){
      animateTo(slideIndex-1,'prev');
    }else{
      snapBack();
    }
  },{passive:true});

  const prevBtn=document.getElementById('prev'); // 左側「次のページ」
  const nextBtn=document.getElementById('next'); // 右側「前のページ」
  if(prevBtn) prevBtn.onclick=()=>animateTo(slideIndex+1,'next');
  if(nextBtn) nextBtn.onclick=()=>animateTo(slideIndex-1,'prev');

  if(topBtn){
    topBtn.onclick=()=>{
      currentPageIndex=0;
      slideIndex=0;
      prepare();
      window.scrollTo({top:0,behavior:'smooth'});
    };
  }

  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight') animateTo(slideIndex+1,'next');
    if(e.key==='ArrowLeft') animateTo(slideIndex-1,'prev');
  });

  let resizeTimer;
  window.addEventListener('resize',()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{
      const newMode=isLandscapeSpread();
      if(newMode!==landscapeMode){
        buildSlides();
      }else{
        prepare();
      }
    },120);
  });

  buildSlides();
})();
</script>
