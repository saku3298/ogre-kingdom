  <button id="prev">← 前のページ</button>
  <button id="next">次のページ →</button>

<div class="reader-footer"><a href="index.html">HOMEへ戻る</a>　|　© YUURI SAKU / OGRE KINGDOM</div>

<script>
const body=document.body;
const pages=[...document.querySelectorAll('.manga-page')];
const counter=document.getElementById('counter');
const modeBtn=document.getElementById('mode');
let idx=0, single=false;

function show(){
  pages.forEach((p,i)=>p.classList.toggle('active',i===idx));
  counter.textContent=single ? (idx===0 ? '表紙' : `${idx} / ${pages.length-1}`) : '縦スクロール表示';
  if(single) window.scrollTo({top:0,behavior:'smooth'});
}
function enableSingle(){
  if(!single){
    single=true;
    body.classList.add('single');
    modeBtn.textContent='縦スクロール';
  }
}
modeBtn.onclick=()=>{
  single=!single;
  body.classList.toggle('single',single);
  modeBtn.textContent=single?'縦スクロール':'1ページ表示';
  show();
};
document.getElementById('prev').onclick=()=>{
  enableSingle(); idx=Math.max(0,idx-1); show();
};
document.getElementById('next').onclick=()=>{
  enableSingle(); idx=Math.min(pages.length-1,idx+1); show();
};
document.getElementById('top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.addEventListener('keydown',e=>{
  if(!single)return;
  if(e.key==='ArrowLeft') document.getElementById('prev').click();
  if(e.key==='ArrowRight') document.getElementById('next').click();
});
</script>
</body>
